<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="sign-up">
  <div class="sign">
    <h1>Sign Up Now!</h1>
    <form>
        <input type="name" class="input-box" placeholder="Name">
        <input type="email" class="input-box" placeholder="Email">
        <input type="password" class="input-box" placeholder="Password">
        <p> <span><input type="checkbox"></span>I agree to the terms of services</p>
        <button type="button" class="sign-bt">Sign up</button>
        <hr>
        <p class="or">OR</p>
        <button type="button" class="sign-bt">Log in with google</button>
        <p>Do you have an account ? <a href="./log.html">Log in</a></p>
    </form>
  </div>
  </section>
</body>
</html>
